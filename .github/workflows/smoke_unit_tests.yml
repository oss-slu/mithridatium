name: Run Python Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[dev]"
            - name: Run Tests
              env:
                  # Keep Typer/Rich help output plain and unwrapped so CLI help
                  # assertions do not depend on the runner's terminal rendering.
                  COLUMNS: "200"
                  NO_COLOR: "1"
              run: python -m pytest tests/smoke tests/unit -q
