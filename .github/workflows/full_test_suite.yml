name: Run Python Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
  contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[dev,hf]"
            - name: Cache CIFAR-10
              id: cifar-cache
              uses: actions/cache@v4
              with:
                  path: data
                  key: cifar10-v1
            - name: Download CIFAR-10
              if: steps.cifar-cache.outputs.cache-hit != 'true'
              run: python -m scripts.download_cifar10
            - name: Cache poison checkpoint
              id: model-cache
              uses: actions/cache@v4
              with:
                  path: models/resnet18_poison.pth
                  key: resnet18-poison-v1
            - name: Download poison checkpoint
              if: steps.model-cache.outputs.cache-hit != 'true'
              run: curl -fsSL --create-dirs -o models/resnet18_poison.pth https://huggingface.co/SuperAddi1/resnet18_poison.pth/resolve/605e2f89cf4042c60ee440cab941365b69d60776/resnet18_poison.pth
            - name: Run spell check
              run: codespell
            - name: Run Tests
              run: python -m pytest -q
