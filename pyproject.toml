[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mithridatium"
version = "0.1.2"
requires-python = ">=3.10"
description = "Framework for verifying integrity of pretrained AI models"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "jsonschema",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.40",
    "huggingface-hub>=0.23",
]
ui = [
    "gradio>=4",
    "streamlit>=1.32",
    "plotly>=5",
]
demo = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "build",
    "twine",
]
all = [
    "transformers>=4.40",
    "huggingface-hub>=0.23",
    "gradio>=4",
    "streamlit>=1.32",
    "plotly>=5",
    "matplotlib>=3.8",
    "pytest>=8",
    "pytest-cov",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mithridatium*"]

[project.scripts]
mithridatium = "mithridatium.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests for isolated functions/classes",
    "integration: tests that exercise multiple modules together",
    "smoke: quick end-to-end sanity tests",
    "slow: tests that take longer to run",
    "requires_data: tests that require downloaded or local datasets",
    "requires_model: tests that require local checkpoint files",
    "requires_hf: tests that require Hugging Face model downloads or cached HF models",
]
